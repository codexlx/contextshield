    @keyframes show5 { 0%, 44% { opacity: 0; } 45%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes show6 { 0%, 54% { opacity: 0; } 55%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes show7 { 0%, 66% { opacity: 0; } 67%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes show8 { 0%, 76% { opacity: 0; } 77%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes show9 { 0%, 84% { opacity: 0; } 85%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
