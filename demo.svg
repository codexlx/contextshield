<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; rx: 12px; stroke: #30363d; stroke-width: 2px; }
    .header { fill: #161b22; }
    .text { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-size: 13.5px; fill: #c9d1d9; }
    .bold { font-weight: bold; }
    .cyan { fill: #58a6ff; }
    .green { fill: #3fb950; }
    .yellow { fill: #d29922; }
    .red { fill: #ff7b72; }
    .muted { fill: #8b949e; }

    .line1, .line2, .line3, .line4, .line5, .line6, .line7, .line8, .line9 {
      opacity: 0;
      animation-duration: 12s;
      animation-iteration-count: infinite;
      animation-fill-mode: forwards;
    }

    .line1 { animation-name: show1; }
    .line2 { animation-name: show2; }
    .line3 { animation-name: show3; }
    .line4 { animation-name: show4; }
    .line5 { animation-name: show5; }
    .line6 { animation-name: show6; }
    .line7 { animation-name: show7; }
    .line8 { animation-name: show8; }
    .line9 { animation-name: show9; }

    @keyframes show1 { 0%, 4% { opacity: 0; } 5%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes show2 { 0%, 14% { opacity: 0; } 15%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes show3 { 0%, 24% { opacity: 0; } 25%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
