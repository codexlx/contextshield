[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextshield"
version = "1.0.0"
description = "Smart LLM Codebase Packer, AST Token Compressor & Prompt Injection Firewall"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CodexLx" }]
keywords = ["llm", "prompt", "ast", "security", "context", "ai-agents", "devsecops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.scripts]
contextshield = "contextshield.cli:main"